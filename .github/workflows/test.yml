name: TestSprite Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
    types: [ opened, synchronize, reopened ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Install Playwright browsers
      run: npx playwright install --with-deps
    
    - name: Start backend server
      run: |
        cd backend
        pip install -r requirements.txt
        python -m uvicorn main:app --host 127.0.0.1 --port 8001 &
        sleep 10
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
    
    - name: Run smoke tests (always)
      run: npm run test:smoke
      env:
        CI: true
    
    - name: Run full test suite (on PR with full-ci label)
      if: contains(github.event.pull_request.labels.*.name, 'full-ci')
      run: npm run test
      env:
        CI: true
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report-${{ matrix.node-version }}
        path: |
          playwright-report/
        retention-days: 30
    
    - name: Comment PR with test results
      if: github.event_name == 'pull_request' && success()
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '## Playwright smoke tests\n\nSmoke tests passed. See the Actions tab for the full report.'
          });
    
    - name: Fail on smoke test failure
      if: failure() && !contains(github.event.pull_request.labels.*.name, 'full-ci')
      run: |
        echo "Smoke tests failed. This is a required check."
        exit 1
