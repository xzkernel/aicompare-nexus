name: CI

on:
  push:
    branches: [main, deploy-ready]
  pull_request:
    branches: [main, deploy-ready]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Audit production npm dependencies
        run: npm run audit:prod
      - name: Typecheck frontend
        run: npm run typecheck
      - name: Lint frontend
        run: npm run lint
      - name: Test frontend
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Install Playwright Chromium
        run: npm exec -- playwright install --with-deps chromium
      - name: Test built frontend
        run: npm exec -- playwright test --config=scripts/playwright.config.mjs

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.lock
      - name: Install backend and audit dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Check Python dependency compatibility
        run: python -m pip check
      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.lock
      - name: Test backend
        run: python -m pytest -q
      - name: Compile backend
        run: python -m compileall -q .

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan repository with Gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --config /repo/.gitleaks.toml --redact --no-banner

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate development Compose configuration
        run: docker compose -f docker-compose.yml config --quiet
      - name: Validate production Compose configuration
        env:
          CORS_ORIGINS: https://ci.example.invalid
        run: docker compose -f docker-compose.prod.yml config --quiet
      - name: Build frontend container
        run: docker build --tag modelwise-frontend:ci .
      - name: Build backend container
        run: docker build --tag modelwise-backend:ci backend

