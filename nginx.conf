events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    upstream backend {
        server backend:8001;
    }

    # Sanitise proxy headers — do not blindly trust X-Forwarded-For from clients
    real_ip_header     X-Forwarded-For;
    real_ip_recursive  on;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Hide nginx version
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # ── Security headers ─────────────────────────────────────────────────
        # ModelWise SPA — local-first evaluation tool, no third-party scripts.
        # CSP is intentionally strict: Supabase CDN connects are allowed via
        # connect-src because Supabase JS uses fetch/XHR, not scripts.
        add_header Content-Security-Policy
            "default-src 'self'; "
            "script-src 'self'; "
            "style-src 'self' 'unsafe-inline'; "
            "img-src 'self' data: https:; "
            "font-src 'self' data:; "
            "connect-src 'self' https://*.supabase.co https://*.supabase.io; "
            "worker-src 'none'; "
            "frame-ancestors 'none'; "
            "base-uri 'self'; "
            "form-action 'self'"
            always;

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
        # HSTS — enable once HTTPS is confirmed in production
        # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # ── Backend proxy (API + SSE) ─────────────────────────────────────────
        location /api/ {
            proxy_pass http://backend/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Sanitise — set X-Forwarded-For to real IP only, strip client-supplied value
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            # SSE needs a generous timeout
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        location /health {
            proxy_pass http://backend/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        # ── SPA fallback ─────────────────────────────────────────────────────
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ── Immutable static assets ───────────────────────────────────────────
        # Vite fingerprints assets; they are safe to cache indefinitely.
        location ~* \.(js|css|woff2?|ttf|eot|png|jpg|jpeg|gif|ico|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            # Re-apply security headers (nginx add_header doesn't inherit inside blocks)
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        }
    }
}
